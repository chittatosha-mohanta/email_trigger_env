[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "email_triage_env"
version = "1.0.0"
description = "An OpenEnv environment for email triage."
readme = "README.md"
requires-python = ">=3.9"
authors = [
    { name = "chittatosha-mohanta" }
]
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
    "pydantic>=2.0.0",
    "websockets>=12.0",
    "requests>=2.31.0",
    "openenv-core>=0.2.0",
    "openai>=1.0.0",
    "httpx>=0.24.0",
]

[tool.setuptools]
packages = ["."]
